name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest

    # Same database image as docker-compose.yml: the geofence and fuel tests
    # run against real PostGIS.
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: fleet
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet -d fleet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: fleet
      DB_USER: fleet
      DB_PASSWORD: fleet

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Tests (pytest)
        run: pytest -v
